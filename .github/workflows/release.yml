name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            config: electron-builder.yml
            artifact: cinelab-windows-x64
          - os: macos-15
            platform: mac
            arch: arm64
            config: electron-builder.mac.yml
            artifact: cinelab-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fix macOS arm64 ffprobe
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/ffprobe-arm64.gz \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-arm64.gz
          gunzip -f /tmp/ffprobe-arm64.gz
          cp /tmp/ffprobe-arm64 node_modules/ffprobe-static/bin/darwin/arm64/ffprobe
          chmod +x node_modules/ffprobe-static/bin/darwin/arm64/ffprobe

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version v$version"
          }

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check:encryption
      - run: pnpm check:docs
      - run: pnpm build

      - name: Build installer
        run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --config ${{ matrix.config }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object {
            $_.Extension -in ".exe", ".zip", ".dmg"
          }
          if (-not $files) { throw "No release assets found for checksums" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "CineLab $tag" --generate-notes
          }

          if (-not (Test-Path "release/latest.yml")) {
            throw "release/latest.yml is missing"
          }

          $assets = Get-ChildItem release -File | Where-Object {
            $_.Extension -in ".exe", ".zip", ".dmg", ".blockmap" -or $_.Name -in "latest.yml", "latest-mac.yml", "SHA256SUMS.txt"
          }
          if (-not $assets) {
            throw "No release assets found"
          }

          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --clobber
          }
