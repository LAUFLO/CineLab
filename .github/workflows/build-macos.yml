name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fix macOS arm64 ffprobe
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/ffprobe-arm64.gz \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-arm64.gz
          gunzip -f /tmp/ffprobe-arm64.gz
          cp /tmp/ffprobe-arm64 node_modules/ffprobe-static/bin/darwin/arm64/ffprobe
          chmod +x node_modules/ffprobe-static/bin/darwin/arm64/ffprobe

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Build macOS arm64
        run: pnpm exec electron-builder --mac --arm64 --config electron-builder.mac.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Smoke test macOS app
        run: |
          APP=$(find release -maxdepth 2 -name 'CineLab.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "CineLab.app not found"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/macos-smoke.mjs "$APP" --install-depth --install-vision --install-whisper
          else
            node scripts/macos-smoke.mjs "$APP"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cinelab-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
