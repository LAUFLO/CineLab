appId: com.cinelab.app
productName: CineLab
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
win:
  icon: icon.ico
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CineLab
