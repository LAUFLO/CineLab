appId: com.cinelab.app
productName: CineLab
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
  # Windows 构建只保留 win32-x64 的 ffprobe；新增 mac/linux 目标时需按平台调整
  - "!node_modules/ffprobe-static/bin/darwin/**"
  - "!node_modules/ffprobe-static/bin/linux/**"
  - "!node_modules/ffprobe-static/bin/win32/ia32/**"
asar: true
asarUnpack:
  - node_modules/ffmpeg-static/ffmpeg.exe
  - node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe
win:
  icon: icon.ico
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CineLab
publish:
  provider: generic
  url: https://github.com/LAUFLO/CineLab/releases/latest/download
extraResources:
  - from: resources/sounds
    to: sounds
