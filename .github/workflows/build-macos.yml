name: Build macOS

on:
  workflow_dispatch:
    inputs:
      asset_only:
        description: Only copy the vision asset (skip build)
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  rename-asset:
    if: inputs.asset_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download old asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download vision-components-v1 \
            --repo "${{ github.repository }}" \
            --pattern "vision-models-win32-x64-v1.zip" \
            --dir dist

      - name: Verify checksum
        run: |
          cd dist
          echo "c00b66f631cb0231eaf286777170662658b7346123ccf16a09f5747e57a1a7f0  vision-models-win32-x64-v1.zip" | sha256sum -c -

      - name: Upload as portable name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/vision-models-win32-x64-v1.zip dist/vision-models-v1.zip
          gh release upload vision-components-v1 dist/vision-models-v1.zip \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Verify uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download vision-components-v1 \
            --repo "${{ github.repository }}" \
            --pattern "vision-models-v1.zip" \
            --dir verify
          cd verify
          sha256sum vision-models-v1.zip
          test "$(stat -c%s vision-models-v1.zip)" = "526828343"
          echo "asset size ok"

  build:
    if: ${{ !inputs.asset_only }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fix macOS arm64 ffprobe
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/ffprobe-arm64.gz \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-arm64.gz
          gunzip -f /tmp/ffprobe-arm64.gz
          cp /tmp/ffprobe-arm64 node_modules/ffprobe-static/bin/darwin/arm64/ffprobe
          chmod +x node_modules/ffprobe-static/bin/darwin/arm64/ffprobe

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:ui
      - run: pnpm build

      - name: Build macOS arm64
        run: pnpm exec electron-builder --mac --arm64 --config electron-builder.mac.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Smoke test macOS app
        run: |
          APP=$(find release -maxdepth 2 -name 'CineLab.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "CineLab.app not found"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/macos-smoke.mjs "$APP" --install-depth --install-vision --install-whisper
          else
            node scripts/macos-smoke.mjs "$APP"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cinelab-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
