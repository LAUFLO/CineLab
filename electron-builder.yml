appId: com.cinelab.app
productName: CineLab
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CineLab
